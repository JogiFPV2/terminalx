[package]
name = "terminalx"
version = "0.1.0"
description = "Lekki menedżer terminali i workflow z AI"
edition = "2021"

[lib]
name = "terminalx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
tokio = { version = "1", features = ["sync", "macros", "net", "io-util", "time", "rt-multi-thread", "process"] }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
crypto_secretbox = "0.1"
if-addrs = "0.15"
base64 = "0.22"
rand = "0.8"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
