# Wydanie: tag v* (np. v0.2.0) buduje instalatory dla Windows, Linux i macOS, podpisuje paczki aktualizacji
# i tworzy szkic wydania na GitHubie z plikiem latest.json dla aktualizatora w aplikacji.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Biblioteki systemowe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Hermitty ${{ github.ref_name }}'
          releaseBody: 'Instalatory poniżej. Zainstalowana aplikacja zaktualizuje się sama.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Aplikacja na Androida (plugin Telefon): podpisany APK dołączany do tego samego szkicu wydania.
  # Sekrety: HERMITTY_PHONE_KEYSTORE_B64 (plik .jks w base64) i HERMITTY_PHONE_KEYSTORE_PASSWORD.
  android:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Klucz podpisu
        run: echo "${{ secrets.HERMITTY_PHONE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/hermitty-phone.jks"
      - name: APK
        working-directory: android
        env:
          HERMITTY_PHONE_KEYSTORE: ${{ runner.temp }}/hermitty-phone.jks
          HERMITTY_PHONE_KEYSTORE_PASSWORD: ${{ secrets.HERMITTY_PHONE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Hermitty-Telefon-${GITHUB_REF_NAME}.apk"
      - name: Do wydania
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload "$GITHUB_REF_NAME" "android/Hermitty-Telefon-${GITHUB_REF_NAME}.apk" --clobber
