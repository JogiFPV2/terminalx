[package]
name = "hermitty-mobile"
version = "0.1.0"
description = "Hermitty na Androida: pilot do Hermitty na komputerze"
edition = "2021"

[lib]
name = "hermitty_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["sync", "macros", "time", "net", "io-util"] }
russh-sftp = "3"
base64 = "0.22"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
